# Honest description of the service that actually runs:
# free Docker web (https://paypilot-docker.onrender.com). No disk, no Starter plan,
# no Render cron. Persistence is Turso. Reminders and keep-alive are GitHub Actions.
services:
  - type: web
    name: paypilot-docker
    runtime: docker
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: ENABLE_SIMULATOR
        sync: false
