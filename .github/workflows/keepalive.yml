name: Keep-alive

on:
  schedule:
    # Render free Docker sleeps when idle. Ping liveness so the demo stays warm.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /api/health/live
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "Set repo secret APP_URL to the live origin, e.g. https://paypilot-docker.onrender.com"
            exit 1
          fi
          curl -fsS "${APP_URL%/}/api/health/live"
